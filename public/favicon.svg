<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="favTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="40%" stop-color="#FCD34D"/>
      <stop offset="80%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#B48B1B"/>
    </linearGradient>
    <linearGradient id="favFront" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="60%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <linearGradient id="favRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#451A03"/>
    </linearGradient>
  </defs>

  <!-- Dark rounded background for clarity on light/dark browser tabs -->
  <rect width="32" height="32" rx="7" fill="#0c0d0e"/>

  <!-- Gold Bar 3D Shape -->
  <!-- Right -->
  <polygon points="24,14 27,16 27,21 23,23 23,18 24,14" fill="url(#favRight)"/>
  <!-- Front -->
  <polygon points="7,17 23,18 23,23 5,22 5,18 7,17" fill="url(#favFront)"/>
  <!-- Top -->
  <polygon points="11,9 21,8 24,14 7,17" fill="url(#favTop)"/>

  <!-- Highlights -->
  <line x1="7" y1="17" x2="24" y2="14" stroke="#FFFBEB" stroke-width="0.8"/>
  <circle cx="20" cy="9" r="0.75" fill="#FFFFFF"/>
</svg>
